<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тапай по клубнике</title>
<style>
body { margin: 0; font-family: Arial; background: #3b0716; color: #fff; text-align: center; height: 100vh; user-select: none; overflow: hidden; }
body.bg-berry { background: #3b0716; }
body.bg-night { background: #0f172a; }
body.bg-forest { background: #06281e; }
body.bg-royal { background: #240046; }
#menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 7px; background: rgba(0,0,0,0.35); padding: 10px; box-sizing: border-box; }
#game { display: none; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; }
.m-btn { width: 250px; padding: 10px; font-size: 14px; font-weight: bold; color: #fff; background: #a4133c; border: 2px solid #ff758f; border-radius: 12px; cursor: pointer; }
.mp3-box { width: 250px; padding: 7px; background: #7209b7; border: 2px solid #f72585; border-radius: 12px; box-sizing: border-box; font-size: 12px; font-weight: bold; }
#top-box, #daily-box, #prof-box { width: 92%; max-width: 400px; max-height: 230px; overflow-y: auto; background: #2b0611; border: 1px solid #ff758f; border-radius: 10px; display: none; padding: 10px; box-sizing: border-box; }
.t-row { display: flex; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid #590d22; font-size: 13px; }
.t-row.me { background: #a4133c; color: #ffe066; font-weight: bold; }
.prof-input { width: 85%; padding: 7px; border-radius: 8px; border: 1px solid #ff758f; background: #3b0716; color: #fff; font-size: 13px; text-align: center; margin-bottom: 6px; }
.opt-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
.opt-btn { padding: 6px 10px; border-radius: 8px; border: 1px solid #ff758f; background: #590d22; color: #fff; cursor: pointer; font-size: 16px; }
.opt-btn.sel { background: #2b9348; border-color: #aacc00; }
.days-grid { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 8px; }
.day-card { flex: 1 1 28%; background: #590d22; border: 1px solid #ff758f; border-radius: 6px; padding: 5px; font-size: 11px; }
.day-card.active { background: #2b9348; border-color: #aacc00; font-weight: bold; }
.day-card.done { opacity: 0.4; }
.rank-badge { display: inline-block; background: #b58300; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 1px solid #ffe066; margin-top: 2px; }
#score { font-size: 44px; font-weight: bold; color: #ffccd5; margin: 2px; }
#berry { width: 170px; height: 170px; border-radius: 50%; background: #ff4d6d; border: 8px solid #ff8fa3; font-size: 80px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#berry:active { transform: scale(0.9); }
#berry.gold { background: #e6ac00; border-color: #fff3b0; box-shadow: 0 0 35px #ffd700; }
#berry.diamond { background: #0096c7; border-color: #caf0f8; box-shadow: 0 0 40px #00b4d8; }
#berry.emerald { background: #2b9348; border-color: #aacc00; box-shadow: 0 0 45px #55a630; }
#berry.ruby { background: #d00000; border-color: #ffccd5; box-shadow: 0 0 55px #ff0054; }
.shop { background: rgba(0,0,0,0.45); padding: 10px; width: 100%; max-width: 460px; border-radius: 20px 20px 0 0; display: flex; flex-wrap: wrap; gap: 5px; box-sizing: border-box; }
.btn { flex: 1 1 30%; padding: 8px 4px; background: #a4133c; color: #fff; border: 1px solid #ff758f; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; }
.btn:disabled { opacity: 0.4; }
.sync-box { border-top: 1px solid #ff758f; margin-top: 8px; padding-top: 8px; }
</style>
</head>
<body class="bg-berry">

<div id="menu">
    <div id="m-ava" style="font-size:42px;">&#127827;</div>
    <h2 style="margin:0; color:#ffccd5;">ТАПАЙ ПО КЛУБНИКЕ</h2>
    <div id="m-rank" class="rank-badge">Престиж: Новичок (x1)</div>
    <div id="m-info" style="color:#ffb3c1; font-size:13px;">Загрузка...</div>
    <button class="m-btn" id="m-cont">Продолжить игру</button>
    <button class="m-btn" id="m-new" style="background:#6a040f;">Новая игра</button>
    <button class="m-btn" id="m-prof" style="background:#0077b6;">Личный профиль / Вход</button>
    <button class="m-btn" id="m-daily" style="background:#2b9348;">Недельный приз</button>
    <button class="m-btn" id="m-top" style="background:#b58300;">Топ-500 игроков</button>
    
    <label class="mp3-box" style="cursor:pointer; display:block;">
        <span id="mp3-label">Выбрать музыку (.mp3)</span>
        <input type="file" id="mp3-file" accept="audio/*" style="width:100%; margin-top:4px; font-size:11px;">
    </label>

    <div id="prof-box">
        <div id="prof-rank-info" style="font-size:12px; color:#ffe066; margin-bottom:6px; font-weight:bold;">Тапов: 0</div>
        <div style="font-size:12px; color:#ffb3c1; margin-bottom:4px;">Твой никнейм:</div>
        <input type="text" id="nick-inp" class="prof-input" maxlength="15" placeholder="Введи ник...">
        <div style="font-size:12px; color:#ffb3c1; margin-bottom:4px;">Выбери аватарку:</div>
        <div class="opt-row" id="ava-row"></div>
        <div style="font-size:12px; color:#ffb3c1; margin-bottom:4px;">Выбери фон игры:</div>
        <div class="opt-row" id="bg-row"></div>
        <button class="btn" id="save-prof" style="width:100%; background:#2b9348;">Сохранить профиль</button>

        <!-- Блок переноса аккаунта по QR или Коду -->
        <div class="sync-box">
            <div style="font-size:12px; color:#ffe066; font-weight:bold; margin-bottom:5px;">Вход по QR-коду или Коду переноса:</div>
            <div style="display:flex; gap:5px; margin-bottom:6px;">
                <button class="btn" id="btn-gen-qr" style="background:#7209b7;">Показать QR / Код</button>
                <button class="btn" id="btn-copy-code" style="background:#3a0ca3;">Скопировать код</button>
            </div>
            <div id="qr-area" style="display:none; background:#fff; padding:8px; border-radius:8px; margin-bottom:6px; color:#000;">
                <img id="qr-img" src="" alt="QR" style="width:150px; height:150px; display:block; margin:0 auto;">
                <div style="font-size:10px; margin-top:4px;">Наведи камеру телефона на QR-код!</div>
            </div>
            <input type="text" id="code-inp" class="prof-input" placeholder="Вставь код сохранения сюда...">
            <button class="btn" id="btn-load-code" style="width:100%; background:#e85d04;">Войти по коду</button>
        </div>
    </div>

    <div id="daily-box"><div class="days-grid" id="days-grid"></div><button class="btn" id="claim-btn" style="width:100%; background:#2b9348;">Забрать!</button></div>
    <div id="top-box"></div>
</div>

<div id="game">
    <div style="padding-top:8px; width:100%;">
        <button class="btn" id="go-menu" style="padding:5px 12px; margin-bottom:3px;">В главное меню</button>
        <div id="g-user" style="font-size:13px; color:#ffe066; font-weight:bold;">Игрок</div>
        <div id="g-rank" class="badge">Престиж: Новичок (0 / 1000 тапов)</div>
        <div id="score">0</div>
        <div style="font-size:13px;">Клик: <b id="pwr">1</b> | Сек: <b id="auto">0</b> | Энергия: <b id="nrg">100</b>/<b id="max-nrg">100</b></div>
        <div id="buff-info" style="color:#ffe066; font-size:12px; font-weight:bold; height:16px;"></div>
    </div>
    <div id="berry">&#127827;</div>
    <div id="info" style="font-size:12px; color:#ffb3c1;">Жми на клубнику!</div>
    <div class="shop">
        <button class="btn" id="b-tap">Сила +1 (<span id="c-tap">15</span>)</button>
        <button class="btn" id="b-auto">Куст +1 (<span id="c-auto">50</span>)</button>
        <button class="btn" id="b-nrg" style="background:#005f73; border-color:#94d2bd;">Энергия +50 (<span id="c-nrg">200</span>)</button>
        <button class="btn" id="b-gold" style="background:#b58300;">Золото (1000)</button>
        <button class="btn" id="b-diam" style="background:#0077b6;">Алмаз (10000)</button>
        <button class="btn" id="b-emer" style="background:#2b9348;">Изумруд (50000)</button>
        <button class="btn" id="b-ruby" style="flex: 1 1 65%; background:#9b0000; border-color:#ff4d6d;">СЕКРЕТ: Рубин x50 (1000000)</button>
        <button class="btn" id="b-rst" style="flex: 1 1 25%; background:#2b0611;">Сброс</button>
    </div>
</div>
<script>
var score = 0, pwr = 1, auto = 0, nrg = 100, maxNrg = 100, cTap = 15, cAuto = 50, cNrg = 200, taps = 0;
var skin = 'none', hasG = false, hasD = false, hasE = false, hasR = false;
var day = 1, lastDate = '', bMult = 1, bSec = 0;
var nick = 'Игрок', ava = '&#127827;', bgTheme = 'bg-berry';
var bgmAudio = null;

var prizes = '+100|x2 тап (60с)|+500|+2 сила|x3 тап (60с)|+1 куст|+5000'.split('|');
var avas = '&#127827;|&#128526;|&#128081;|&#128049;|&#129302;|&#128293;'.split('|');
var bgIds = 'bg-berry|bg-night|bg-forest|bg-royal'.split('|');
var bgNames = 'Ягода|Ночь|Лес|Неон'.split('|');

function getPrestige() {
    if (taps >= 150000) return { name: 'Бог Клубники', mult: 10, next: 'МАКС' };
    if (taps >= 100000) return { name: 'Легенда', mult: 5, next: 150000 };
    if (taps >= 50000) return { name: 'Про', mult: 3, next: 100000 };
    if (taps >= 10000) return { name: 'Полу-про', mult: 2, next: 50000 };
    if (taps >= 1000) return { name: 'Любитель', mult: 1.5, next: 10000 };
    return { name: 'Новичок', mult: 1, next: 1000 };
}

var wav = "";
try {
    var rate = 11025, len = 900, buf = new ArrayBuffer(44 + len), v = new DataView(buf);
    function w(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    w(0, 'RIFF'); v.setUint32(4, 36 + len, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, 'data'); v.setUint32(40, len, true);
    for (var i = 0; i < len; i++) {
        var t = i / rate, fn = (t < 0.015 ? (Math.random() * 2 - 1) * Math.exp(-t * 250) * 110 : 0) + (t < 0.05 ? Math.sin(1100 * t) * Math.exp(-t * 100) * 90 : 0);
        v.setUint8(44 + i, Math.max(0, Math.min(255, 128 + fn)));
    }
    var bin = '', bytes = new Uint8Array(buf);
    for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    wav = 'data:audio/wav;base64,' + btoa(bin);
} catch(e) {}

function snd() { try { if (wav) { var a = new Audio(wav); a.playbackRate = 0.9 + Math.random() * 0.2; a.play(); } } catch(e) {} }

function getDataObj() {
    return { score: Math.floor(score), power: pwr, auto: auto, energy: Math.floor(nrg), maxNrg: maxNrg, costTap: cTap, costAuto: cAuto, costNrg: cNrg, taps: taps, hasGold: hasG, hasDiamond: hasD, hasEmerald: hasE, hasRuby: hasR, skin: skin, day: day, lastDate: lastDate, nick: nick, ava: ava, bgTheme: bgTheme };
}

function applyDataObj(d) {
    if (!d) return;
    score = +d.score || 0; pwr = +d.power || 1; auto = +d.auto || 0;
    nrg = +d.energy || 100; maxNrg = +d.maxNrg || 100;
    cTap = +d.costTap || 15; cAuto = +d.costAuto || 50; cNrg = +d.costNrg || 200;
    taps = +d.taps || 0;
    hasG = !!d.hasGold; hasD = !!d.hasDiamond; hasE = !!d.hasEmerald; hasR = !!d.hasRuby;
    skin = d.skin || 'none'; day = +d.day || 1; lastDate = d.lastDate || '';
    if (d.nick) nick = d.nick; if (d.ava) ava = d.ava; if (d.bgTheme) bgTheme = d.bgTheme;
}

// Кодирование сохранения в короткий текстовый код (работает с русскими никами)
function makeCode() {
    return btoa(unescape(encodeURIComponent(JSON.stringify(getDataObj()))));
}

function parseCode(str) {
    try {
        var clean = str.trim();
        if (clean.indexOf('?code=') !== -1) clean = clean.split('?code=')[1].split('&')[0];
        var obj = JSON.parse(decodeURIComponent(escape(atob(clean))));
        applyDataObj(obj);
        save();
        return true;
    } catch(e) { return false; }
}

try {
    var saved = JSON.parse(localStorage.getItem('berry_v3'));
    if (saved) applyDataObj(saved);
    // Автоматический вход, если открыли сайт по QR-коду (?code=...)
    if (window.location.search.indexOf('code=') !== -1) {
        if (parseCode(window.location.search)) {
            window.history.replaceState({}, '', window.location.pathname);
        }
    }
} catch(e) {}

function save() {
    try { localStorage.setItem('berry_v3', JSON.stringify(getDataObj())); } catch(e) {}
}

function mult() {
    var sMult = skin === 'gold' ? 2 : skin === 'diamond' ? 5 : skin === 'emerald' ? 15 : skin === 'ruby' ? 50 : 1;
    return sMult * bMult * getPrestige().mult;
}
</script>
<script>
function draw() {
    var pr = getPrestige();
    document.body.className = bgTheme;
    document.getElementById('m-ava').innerHTML = ava;
    document.getElementById('g-user').innerHTML = ava + ' ' + nick;
    document.getElementById('m-rank').innerText = 'Престиж: ' + pr.name + ' (x' + pr.mult + ')';
    document.getElementById('g-rank').innerText = pr.name + ' (x' + pr.mult + ') | Тапы: ' + taps + ' / ' + pr.next;
    document.getElementById('score').innerText = Math.floor(score);
    document.getElementById('m-info').innerText = nick + ' | Счёт: ' + Math.floor(score);
    document.getElementById('pwr').innerText = Math.round(pwr * mult() * 10) / 10;
    document.getElementById('auto').innerText = auto;
    document.getElementById('nrg').innerText = Math.floor(nrg);
    document.getElementById('max-nrg').innerText = maxNrg;
    document.getElementById('c-tap').innerText = cTap;
    document.getElementById('c-auto').innerText = cAuto;
    document.getElementById('c-nrg').innerText = cNrg;
    document.getElementById('buff').innerText = bSec > 0 ? ('БОНУС x' + bMult + ': ' + bSec + 'с') : '';
    document.getElementById('b-tap').disabled = score < cTap;
    document.getElementById('b-auto').disabled = score < cAuto;
    document.getElementById('b-nrg').disabled = score < cNrg;
    document.getElementById('berry').className = skin === 'none' ? '' : skin;

    var bg = document.getElementById('b-gold'); bg.disabled = !hasG && score < 1000; bg.innerText = hasG ? (skin === 'gold' ? 'Снять Золото' : 'Золото (x2)') : 'Золото (1000)';
    var bd = document.getElementById('b-diam'); bd.disabled = !hasD && score < 10000; bd.innerText = hasD ? (skin === 'diamond' ? 'Снять Алмаз' : 'Алмаз (x5)') : 'Алмаз (10000)';
    var be = document.getElementById('b-emer'); be.disabled = !hasE && score < 50000; be.innerText = hasE ? (skin === 'emerald' ? 'Снять Изумруд' : 'Изумруд (x15)') : 'Изумруд (50000)';
    var br = document.getElementById('b-ruby'); br.disabled = !hasR && score < 1000000; br.innerText = hasR ? (skin === 'ruby' ? 'Снять Рубин' : 'Рубин (x50)') : 'СЕКРЕТ: Рубин x50 (1000000)';
}

function closeBoxes() {
    document.getElementById('top-box').style.display = 'none';
    document.getElementById('daily-box').style.display = 'none';
    document.getElementById('prof-box').style.display = 'none';
}

document.getElementById('mp3-file').onchange = function(e) {
    var file = e.target.files.item(0);
    if (!file) return;
    if (bgmAudio) bgmAudio.pause();
    bgmAudio = new Audio(URL.createObjectURL(file));
    bgmAudio.loop = true; bgmAudio.volume = 0.6;
    document.getElementById('mp3-label').innerText = 'Играет: ' + file.name.slice(0, 16);
    bgmAudio.play();
};

function showProf() {
    var pr = getPrestige();
    document.getElementById('prof-rank-info').innerText = 'Ранг: ' + pr.name + ' (x' + pr.mult + ') | Всего тапов: ' + taps;
    document.getElementById('nick-inp').value = nick;
    document.getElementById('qr-area').style.display = 'none';
    var ar = document.getElementById('ava-row'); ar.innerHTML = '';
    for (var i = 0; i < avas.length; i++) {
        (function(a) {
            var b = document.createElement('button'); b.className = 'opt-btn' + (ava === a ? ' sel' : ''); b.innerHTML = a;
            b.onclick = function() { snd(); ava = a; showProf(); draw(); }; ar.appendChild(b);
        })(avas[i]);
    }
    var br = document.getElementById('bg-row'); br.innerHTML = '';
    for (var j = 0; j < bgIds.length; j++) {
        (function(id, nm) {
            var b = document.createElement('button'); b.className = 'opt-btn' + (bgTheme === id ? ' sel' : ''); b.style.fontSize = '12px'; b.innerText = nm;
            b.onclick = function() { snd(); bgTheme = id; showProf(); draw(); }; br.appendChild(b);
        })(bgIds[j], bgNames[j]);
    }
}

// Генерация QR-кода и текстового кода для входа
document.getElementById('btn-gen-qr').onclick = function() {
    snd();
    var code = makeCode();
    document.getElementById('code-inp').value = code;
    var baseUrl = window.location.href.split('?')[0];
    var qrPayload = (baseUrl.indexOf('http') === 0) ? (baseUrl + '?code=' + encodeURIComponent(code)) : code;
    document.getElementById('qr-img').src = 'https://qrserver.com' + encodeURIComponent(qrPayload);
    document.getElementById('qr-area').style.display = 'block';
};

document.getElementById('btn-copy-code').onclick = function() {
    snd();
    var code = makeCode();
    var inp = document.getElementById('code-inp');
    inp.value = code;
    inp.select();
    try { document.execCommand('copy'); } catch(e) {}
    this.innerText = 'Скопировано!';
    var btn = this;
    setTimeout(function() { btn.innerText = 'Скопировать код'; }, 1500);
};

document.getElementById('btn-load-code').onclick = function() {
    snd();
    var val = document.getElementById('code-inp').value;
    if (parseCode(val)) {
        draw(); showProf();
        this.innerText = 'Успешный вход!';
        var btn = this;
        setTimeout(function() { btn.innerText = 'Войти по коду'; closeBoxes(); }, 1000);
    } else {
        this.innerText = 'Неверный код!';
        var btn = this;
        setTimeout(function() { btn.innerText = 'Войти по коду'; }, 1500);
    }
};

document.getElementById('m-prof').onclick = function() { snd(); var p = document.getElementById('prof-box'); var open = p.style.display === 'block'; closeBoxes(); if (!open) { showProf(); p.style.display = 'block'; } };
document.getElementById('save-prof').onclick = function() { snd(); var v = document.getElementById('nick-inp').value.trim(); if (v) nick = v; save(); draw(); closeBoxes(); };

function showDaily() {
    var g = document.getElementById('days-grid'); g.innerHTML = '';
    var today = new Date().toISOString().slice(0, 10), done = (lastDate === today);
    for (var i = 0; i < 7; i++) {
        var c = document.createElement('div');
        c.className = 'day-card' + ((i + 1 < day || (i + 1 === day && done)) ? ' done' : (i + 1 === day ? ' active' : ''));
        c.innerHTML = '<b>День ' + (i + 1) + '</b><br>' + prizes[i]; g.appendChild(c);
    }
    var cb = document.getElementById('claim-btn'); cb.disabled = done;
    cb.innerText = done ? 'Забрано! Приходи завтра' : ('Забрать День ' + day);
}

document.getElementById('m-daily').onclick = function() { snd(); var b = document.getElementById('daily-box'); var open = b.style.display === 'block'; closeBoxes(); if (!open) { showDaily(); b.style.display = 'block'; } };
document.getElementById('claim-btn').onclick = function() {
    var today = new Date().toISOString().slice(0, 10); if (lastDate === today) return; snd();
    if (day === 1) score += 100; else if (day === 2) { bMult = 2; bSec = 60; } else if (day === 3) score += 500;
    else if (day === 4) pwr += 2; else if (day === 5) { bMult = 3; bSec = 60; } else if (day === 6) auto += 1; else if (day === 7) score += 5000;
    lastDate = today; day = day >= 7 ? 1 : day + 1; save(); draw(); showDaily();
};

document.getElementById('m-cont').onclick = function() { snd(); document.getElementById('menu').style.display = 'none'; document.getElementById('game').style.display = 'flex'; draw(); };
document.getElementById('m-new').onclick = function() { snd(); score = 0; pwr = 1; auto = 0; nrg = 100; maxNrg = 100; cTap = 15; cAuto = 50; cNrg = 200; taps = 0; skin = 'none'; hasG = hasD = hasE = hasR = false; bMult = 1; bSec = 0; save(); draw(); document.getElementById('menu').style.display = 'none'; document.getElementById('game').style.display = 'flex'; };
document.getElementById('go-menu').onclick = function() { snd(); draw(); closeBoxes(); document.getElementById('game').style.display = 'none'; document.getElementById('menu').style.display = 'flex'; };

document.getElementById('m-top').onclick = function() {
    snd(); var box = document.getElementById('top-box'); var open = box.style.display === 'block'; closeBoxes(); if (open) return;
    var names = 'КлубникаПро|ТаперКинг|Ягодка|МегаКлик|Фермер|Агроном'.split('|'), list = [];
    for (var i = 1; i <= 499; i++) list.push({ n: names[i % 6] + '_' + (100 + i), p: Math.floor(Math.pow(500 - i, 2.2) * 1.2) + 25, me: false });
    list.push({ n: ava + ' ' + nick + ' [' + getPrestige().name + ']', p: Math.floor(score), me: true });
    list.sort(function(a, b) { return b.p - a.p; }); box.innerHTML = '';
    for (var j = 0; j < list.length; j++) {
        var r = document.createElement('div'); r.className = list[j].me ? 't-row me' : 't-row';
        r.innerHTML = '<span>#' + (j + 1) + ' ' + list[j].n + '</span><span>' + list[j].p + '</span>'; box.appendChild(r);
        if (list[j].me) document.getElementById('m-info').innerText = 'Место: #' + (j + 1) + ' из 500';
    }
    box.style.display = 'block';
};

document.getElementById('berry').onclick = function() { if (nrg >= 1) { taps++; score += pwr * mult(); nrg -= 1; snd(); draw(); save(); } };
document.getElementById('b-tap').onclick = function() { if (score >= cTap) { score -= cTap; pwr++; cTap = Math.round(cTap * 1.5); snd(); draw(); save(); } };
document.getElementById('b-auto').onclick = function() { if (score >= cAuto) { score -= cAuto; auto++; cAuto = Math.round(cAuto * 1.6); snd(); draw(); save(); } };
document.getElementById('b-nrg').onclick = function() { if (score >= cNrg) { score -= cNrg; maxNrg += 50; nrg = maxNrg; cNrg = Math.round(cNrg * 1.8); snd(); draw(); save(); } };
document.getElementById('b-gold').onclick = function() { if (hasG) skin = skin === 'gold' ? 'none' : 'gold'; else if (score >= 1000) { score -= 1000; hasG = true; skin = 'gold'; } snd(); draw(); save(); };
document.getElementById('b-diam').onclick = function() { if (hasD) skin = skin === 'diamond' ? 'none' : 'diamond'; else if (score >= 10000) { score -= 10000; hasD = true; skin = 'diamond'; } snd(); draw(); save(); };
