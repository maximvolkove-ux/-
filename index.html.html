<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тапай по клубнике</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#3b0716;color:#fff;text-align:center;min-height:100vh;overflow-y:auto}
body.bg-night{background:#0f172a}body.bg-forest{background:#06281e}body.bg-royal{background:#240046}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:7px;padding:12px;box-sizing:border-box}
#game{display:none;flex-direction:column;align-items:center;justify-content:space-between;min-height:100vh;box-sizing:border-box}
.m-btn{width:255px;max-width:92%;padding:11px;font-size:14px;font-weight:bold;color:#fff;background:#a4133c;border:2px solid #ff758f;border-radius:12px;cursor:pointer}
.mp3-box{width:255px;max-width:92%;padding:7px;background:#7209b7;border:2px solid #f72585;border-radius:12px;box-sizing:border-box;font-size:12px;font-weight:bold}
.box{width:92%;max-width:400px;max-height:240px;overflow-y:auto;background:#2b0611;border:1px solid #ff758f;border-radius:10px;display:none;padding:10px;box-sizing:border-box}
.t-row{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #590d22;font-size:13px}
.t-row.me{background:#a4133c;color:#ffe066;font-weight:bold}
.inp{width:88%;padding:7px;border-radius:8px;border:1px solid #ff758f;background:#3b0716;color:#fff;font-size:13px;text-align:center;margin-bottom:6px}
.row{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.opt{padding:6px 10px;border-radius:8px;border:1px solid #ff758f;background:#590d22;color:#fff;cursor:pointer;font-size:16px}
.opt.sel{background:#2b9348;border-color:#aacc00}
.grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:8px}
.card{flex:1 1 28%;background:#590d22;border:1px solid #ff758f;border-radius:6px;padding:5px;font-size:11px}
.card.act{background:#2b9348;border-color:#aacc00;font-weight:bold}.card.done{opacity:0.4}
.badge{display:inline-block;background:#b58300;color:#fff;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;border:1px solid #ffe066;margin-top:2px}
#score{font-size:44px;font-weight:bold;color:#ffccd5;margin:3px}
#berry{width:175px;height:175px;margin:6px auto;border-radius:50%;background:#ff4d6d;border:8px solid #ff8fa3;font-size:82px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#berry:active{transform:scale(0.92)}
#berry.gold{background:#e6ac00;border-color:#fff3b0;box-shadow:0 0 35px #ffd700}
#berry.diamond{background:#0096c7;border-color:#caf0f8;box-shadow:0 0 40px #00b4d8}
#berry.emerald{background:#2b9348;border-color:#aacc00;box-shadow:0 0 45px #55a630}
#berry.ruby{background:#d00000;border-color:#ffccd5;box-shadow:0 0 55px #ff0054}
.shop{background:rgba(0,0,0,0.45);padding:10px;width:100%;max-width:460px;border-radius:20px 20px 0 0;display:flex;flex-wrap:wrap;gap:5px;box-sizing:border-box;margin-top:auto}
.btn{flex:1 1 30%;padding:9px 4px;background:#a4133c;color:#fff;border:1px solid #ff758f;border-radius:8px;font-size:12px;cursor:pointer;font-weight:bold}
.btn:disabled{opacity:0.4}
/* Стили Рюкзака и редкостей питомцев */
#bag-box{width:92%;max-width:420px;max-height:190px;overflow-y:auto;background:#1a030a;border:2px solid #ffba08;border-radius:12px;display:none;padding:8px;box-sizing:border-box;margin:4px auto}
.pet-grid{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.pet-card{flex:1 1 28%;background:#2b0611;border:2px solid #888;border-radius:8px;padding:5px;font-size:11px;cursor:pointer}
.pet-card.eq{box-shadow:0 0 10px #fff;transform:scale(1.03)}
.r-0{border-color:#adb5bd}.r-1{border-color:#38b000}.r-2{border-color:#00b4d8}.r-3{border-color:#9d4edd}.r-4{border-color:#ff0054}.r-5{border-color:#ffd60a;background:#3d2c00}
</style>
</head>
<body>

<div id="menu">
    <div id="m-ava" style="font-size:42px">&#127827;</div>
    <h2 style="margin:0;color:#ffccd5;font-size:20px">ТАПАЙ ПО КЛУБНИКЕ</h2>
    <div id="m-rank" class="badge">Престиж: Новичок (x1)</div>
    <div id="m-info" style="color:#ffb3c1;font-size:13px">Загрузка...</div>
    <button class="m-btn" id="m-cont">Продолжить игру</button>
    <button class="m-btn" id="m-new" style="background:#6a040f">Новая игра</button>
    <button class="m-btn" id="m-prof" style="background:#0077b6">Личный профиль / Вход</button>
    <button class="m-btn" id="m-daily" style="background:#2b9348">Недельный приз</button>
    <button class="m-btn" id="m-top" style="background:#b58300">Топ-500 игроков</button>
    <label class="mp3-box" style="cursor:pointer;display:block">
        <span id="mp3-lbl">Выбрать музыку (.mp3)</span>
        <input type="file" id="mp3-file" accept="audio/*" style="width:100%;margin-top:4px;font-size:11px">
    </label>

    <div id="prof-box" class="box">
        <div id="p-rank" style="font-size:12px;color:#ffe066;margin-bottom:6px;font-weight:bold">Тапов: 0</div>
        <input type="text" id="nick-inp" class="inp" maxlength="15" placeholder="Введи ник...">
        <div class="row" id="ava-row"></div>
        <div class="row" id="bg-row"></div>
        <button class="btn" id="save-prof" style="width:100%;background:#2b9348;margin-bottom:8px">Сохранить профиль</button>
        <div style="border-top:1px solid #ff758f;padding-top:8px">
            <div style="font-size:12px;color:#ffe066;font-weight:bold;margin-bottom:5px">Вход по QR-коду или Коду:</div>
            <div style="display:flex;gap:5px;margin-bottom:6px">
                <button class="btn" id="btn-qr" style="background:#7209b7">Показать QR</button>
                <button class="btn" id="btn-copy" style="background:#3a0ca3">Скопировать код</button>
            </div>
            <div id="qr-area" style="display:none;background:#fff;padding:8px;border-radius:8px;margin-bottom:6px;color:#000">
                <img id="qr-img" src="" alt="QR" style="width:140px;height:140px;display:block;margin:0 auto">
                <div style="font-size:10px;margin-top:4px">Сканируй камерой телефона!</div>
            </div>
            <input type="text" id="code-inp" class="inp" placeholder="Вставь код сюда...">
            <button class="btn" id="btn-load" style="width:100%;background:#e85d04">Войти по коду</button>
        </div>
    </div>
    <div id="daily-box" class="box"><div class="grid" id="days-grid"></div><button class="btn" id="claim-btn" style="width:100%;background:#2b9348">Забрать!</button></div>
    <div id="top-box" class="box"></div>
</div>

<div id="game">
    <div style="padding-top:8px;width:100%">
        <div style="display:flex;gap:6px;justify-content:center;padding:0 10px">
            <button class="btn" id="go-menu" style="padding:7px">В меню</button>
            <button class="btn" id="btn-bag" style="padding:7px;background:#e85d04;border-color:#ffba08">Рюкзак (<span id="bag-cnt">0</span>)</button>
        </div>
        <div id="g-user" style="font-size:13px;color:#ffe066;font-weight:bold;margin-top:3px">Игрок</div>
        <div id="g-pet" style="font-size:12px;color:#90e0ef">Питомец: Нет (x1)</div>
        <div id="g-rank" class="badge">Новичок (0 / 1000 тапов)</div>
        <div id="score">0</div>
        <div style="font-size:13px">Клик: <b id="pwr">1</b> | Сек: <b id="auto">0</b> | Энергия: <b id="nrg">100</b>/<b id="max-nrg">100</b></div>
        <div id="buff" style="color:#ffe066;font-size:12px;font-weight:bold;height:16px"></div>
    </div>

    <!-- Окно Рюкзака -->
    <div id="bag-box">
        <div style="font-size:12px;color:#ffba08;font-weight:bold;margin-bottom:5px">Твой Рюкзак (нажми, чтобы надеть):</div>
        <div class="pet-grid" id="pet-grid"></div>
    </div>

    <div id="berry">&#127827;</div>
    <div id="drop-info" style="font-size:12px;color:#ffe066;font-weight:bold;height:16px">Жми на клубнику!</div>

    <div class="shop">
        <button class="btn" id="b-tap">Сила +1 (<span id="c-tap">15</span>)</button>
        <button class="btn" id="b-auto">Куст +1 (<span id="c-auto">50</span>)</button>
        <button class="btn" id="b-nrg" style="background:#005f73">Энергия +50 (<span id="c-nrg">200</span>)</button>
        <button class="btn" id="b-egg" style="flex:1 1 95%;background:#7209b7;border-color:#f72585;font-size:13px">Купить Яйцо питомца (500)</button>
        <button class="btn" id="b-gold" style="background:#b58300">Золото (1000)</button>
        <button class="btn" id="b-diam" style="background:#0077b6">Алмаз (10000)</button>
        <button class="btn" id="b-emer" style="background:#2b9348">Изумруд (50000)</button>
        <button class="btn" id="b-ruby" style="flex:1 1 65%;background:#9b0000">Рубин x50 (1000000)</button>
        <button class="btn" id="b-rst" style="flex:1 1 25%;background:#2b0611">Сброс</button>
    </div>
</div>
<script>
var score=0,pwr=1,auto=0,nrg=100,maxNrg=100,cTap=15,cAuto=50,cNrg=200,taps=0;
var skin='none',hasG=false,hasD=false,hasE=false,hasR=false,day=1,lastDate='',bMult=1,bSec=0;
var nick='Игрок',ava='&#127827;',bg='',bgm=null,bag='',eqPet=-1;
var prizes='+100|x2 тап (60с)|+500|+2 сила|x3 тап (60с)|+1 куст|+5000'.split('|');
var avas='&#127827;|&#128526;|&#128081;|&#128049;|&#129302;|&#128293;'.split('|');
var bgIds='|bg-night|bg-forest|bg-royal'.split('|'),bgNms='Ягода|Ночь|Лес|Неон'.split('|');

// База питомцев: 0-Обычный(20%), 1-Редкий(30%), 2-Сверхредкий(20%), 3-Эпик(15%), 4-Мифик(10%), 5-Легендарный(5%)
var pRar='Обычный|Редкий|Сверхредкий|Эпик|Мифик|Легендарный'.split('|');
var pNam='Цыплёнок|Собака|Панда|Тигр|Карась|Кот'.split('|');
var pIco='&#128037;|&#128054;|&#128060;|&#128047;|&#128031;|&#128049;'.split('|');
var pMul='1.2|1.5|3|5|10|20'.split('|');

function getPr(){
    if(taps>=150000)return{n:'Бог Клубники',m:10,nx:'МАКС'};
    if(taps>=100000)return{n:'Легенда',m:5,nx:150000};
    if(taps>=50000)return{n:'Про',m:3,nx:100000};
    if(taps>=10000)return{n:'Полу-про',m:2,nx:50000};
    if(taps>=1000)return{n:'Любитель',m:1.5,nx:10000};
    return{n:'Новичок',m:1,nx:1000};
}

var wav='';
try{
    var r=11025,l=900,b=new ArrayBuffer(44+l),v=new DataView(b);
    function w(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
    w(0,'RIFF');v.setUint32(4,36+l,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,r,true);v.setUint32(28,r,true);
    v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,l,true);
    for(var i=0;i<l;i++){var t=i/r,f=(t<0.015?(Math.random()*2-1)*Math.exp(-t*250)*110:0)+(t<0.05?Math.sin(1100*t)*Math.exp(-t*100)*90:0);v.setUint8(44+i,Math.max(0,Math.min(255,128+f)))}
    var bin='',u=new Uint8Array(b);for(var j=0;j<u.length;j++)bin+=String.fromCharCode(u[j]);
    wav='data:audio/wav;base64,'+btoa(bin);
}catch(e){}
function snd(){try{if(wav){var a=new Audio(wav);a.playbackRate=0.9+Math.random()*0.2;a.play()}}catch(e){}}

function getObj(){return{score:Math.floor(score),power:pwr,auto:auto,energy:Math.floor(nrg),maxNrg:maxNrg,costTap:cTap,costAuto:cAuto,costNrg:cNrg,taps:taps,hasGold:hasG,hasDiamond:hasD,hasEmerald:hasE,hasRuby:hasR,skin:skin,day:day,lastDate:lastDate,nick:nick,ava:ava,bgTheme:bg,bag:bag,eqPet:eqPet}}
function setObj(d){if(!d)return;score=+d.score||0;pwr=+d.power||1;auto=+d.auto||0;nrg=+d.energy||100;maxNrg=+d.maxNrg||100;cTap=+d.costTap||15;cAuto=+d.costAuto||50;cNrg=+d.costNrg||200;taps=+d.taps||0;hasG=!!d.hasGold;hasD=!!d.hasDiamond;hasE=!!d.hasEmerald;hasR=!!d.hasRuby;skin=d.skin||'none';day=+d.day||1;lastDate=d.lastDate||'';if(d.nick)nick=d.nick;if(d.ava)ava=d.ava;if(d.bgTheme)bg=d.bgTheme;if(typeof d.bag==='string')bag=d.bag;if(d.eqPet!==undefined)eqPet=+d.eqPet}
function makeCode(){return btoa(unescape(encodeURIComponent(JSON.stringify(getObj()))))}
function parseCode(s){try{var c=s.trim(),p=c.indexOf('code=');if(p!==-1)c=decodeURIComponent(c.substring(p+5));var a=c.indexOf('&');if(a!==-1)c=c.substring(0,a);setObj(JSON.parse(decodeURIComponent(escape(atob(c)))));save();return true}catch(e){return false}}

try{var sv=JSON.parse(localStorage.getItem('berry_v3'));if(sv)setObj(sv);if(location.search.indexOf('code=')!==-1&&parseCode(location.search))history.replaceState({},'',location.pathname)}catch(e){}
function save(){try{localStorage.setItem('berry_v3',JSON.stringify(getObj()))}catch(e){}}
function petMult(){return(eqPet>=0&&eqPet<=5)?+pMul.slice(eqPet,eqPet+1).shift():1}
function mult(){return(skin==='gold'?2:skin==='diamond'?5:skin==='emerald'?15:skin==='ruby'?50:1)*bMult*getPr().m*petMult()}
function $(id){return document.getElementById(id)}
</script>
<script>
function draw(){
    var pr=getPr();document.body.className=bg;$('m-ava').innerHTML=ava;$('g-user').innerHTML=ava+' '+nick;
    $('m-rank').innerText='Престиж: '+pr.n+' (x'+pr.m+')';$('g-rank').innerText=pr.n+' (x'+pr.m+') | Тапы: '+taps+' / '+pr.nx;
    $('bag-cnt').innerText=bag.length;
    if(eqPet>=0&&eqPet<=5){$('g-pet').innerHTML='Питомец: '+pIco.slice(eqPet,eqPet+1).shift()+' '+pNam.slice(eqPet,eqPet+1).shift()+' (x'+petMult()+')'}else{$('g-pet').innerText='Питомец: Нет (x1)'}
    $('score').innerText=Math.floor(score);$('m-info').innerText=nick+' | Счёт: '+Math.floor(score);
    $('pwr').innerText=Math.round(pwr*mult()*10)/10;$('auto').innerText=auto;$('nrg').innerText=Math.floor(nrg);$('max-nrg').innerText=maxNrg;
    $('c-tap').innerText=cTap;$('c-auto').innerText=cAuto;$('c-nrg').innerText=cNrg;
    $('buff').innerText=bSec>0?('БОНУС x'+bMult+': '+bSec+'с'):'';
    $('b-tap').disabled=score<cTap;$('b-auto').disabled=score<cAuto;$('b-nrg').disabled=score<cNrg;$('b-egg').disabled=score<500;
    $('berry').className=skin==='none'?'':skin;
    var b1=$('b-gold');b1.disabled=!hasG&&score<1000;b1.innerText=hasG?(skin==='gold'?'Снять Золото':'Золото (x2)'):'Золото (1000)';
    var b2=$('b-diam');b2.disabled=!hasD&&score<10000;b2.innerText=hasD?(skin==='diamond'?'Снять Алмаз':'Алмаз (x5)'):'Алмаз (10000)';
    var b3=$('b-emer');b3.disabled=!hasE&&score<50000;b3.innerText=hasE?(skin==='emerald'?'Снять Изумруд':'Изумруд (x15)'):'Изумруд (50000)';
    var b4=$('b-ruby');b4.disabled=!hasR&&score<1000000;b4.innerText=hasR?(skin==='ruby'?'Снять Рубин':'Рубин (x50)'):'Рубин x50 (1000000)';
}

function renderBag(){
    var g=$('pet-grid');g.innerHTML='';
    if(bag.length===0){g.innerHTML='<div style="font-size:12px;color:#ffb3c1">Рюкзак пуст! Купи яйцо внизу.</div>';return}
    for(var i=0;i<bag.length;i++){
        (function(id){
            var c=document.createElement('div');
            c.className='pet-card r-'+id+(eqPet===id?' eq':'');
            c.innerHTML='<div style="font-size:24px">'+pIco.slice(id,id+1).shift()+'</div><b>'+pNam.slice(id,id+1).shift()+'</b><br><span style="font-size:10px">'+pRar.slice(id,id+1).shift()+'</span><br><b style="color:#ffe066">x'+pMul.slice(id,id+1).shift()+'</b>';
            c.onclick=function(){snd();eqPet=(eqPet===id)?-1:id;save();draw();renderBag()};
            g.appendChild(c);
        })(+bag.charAt(i));
    }
}

$('btn-bag').onclick=function(){snd();var b=$('bag-box'),o=b.style.display==='block';b.style.display=o?'none':'block';if(!o)renderBag()};

// Покупка яйца с шансами: Легенд 5%, Мифик 10%, Эпик 15%, Сверхредкий 20%, Редкий 30%, Обычный 20%
$('b-egg').onclick=function(){
    if(score<500)return;
    score-=500;snd();
    var rnd=Math.random()*100,id=0;
    if(rnd<5)id=5;else if(rnd<15)id=4;else if(rnd<30)id=3;else if(rnd<50)id=2;else if(rnd<80)id=1;else id=0;
    bag+=String(id);
    if(petMult()<+pMul.slice(id,id+1).shift())eqPet=id;
    $('drop-info').innerHTML='Выпал: '+pIco.slice(id,id+1).shift()+' '+pRar.slice(id,id+1).shift()+' '+pNam.slice(id,id+1).shift()+' (x'+pMul.slice(id,id+1).shift()+')!';
    if($('bag-box').style.display==='block')renderBag();
    draw();save();
};

function hide(){$('top-box').style.display='none';$('daily-box').style.display='none';$('prof-box').style.display='none'}
$('mp3-file').onchange=function(e){var f=e.target.files.item(0);if(!f)return;if(bgm)bgm.pause();bgm=new Audio(URL.createObjectURL(f));bgm.loop=true;bgm.volume=0.6;$('mp3-lbl').innerText='Играет: '+f.name.slice(0,16);bgm.play()};

function showProf(){
    var pr=getPr();$('p-rank').innerText='Ранг: '+pr.n+' (x'+pr.m+') | Тапов: '+taps;$('nick-inp').value=nick;$('qr-area').style.display='none';
    var ar=$('ava-row');ar.innerHTML='';
    for(var i=0;i<avas.length;i++)(function(a){var b=document.createElement('button');b.className='opt'+(ava===a?' sel':'');b.innerHTML=a;b.onclick=function(){snd();ava=a;showProf();draw()};ar.appendChild(b)})(avas.slice(i,i+1).shift());
    var br=$('bg-row');br.innerHTML='';
    for(var j=0;j<bgIds.length;j++)(function(id,nm){var b=document.createElement('button');b.className='opt'+(bg===id?' sel':'');b.style.fontSize='12px';b.innerText=nm;b.onclick=function(){snd();bg=id;showProf();draw()};br.appendChild(b)})(bgIds.slice(j,j+1).shift(),bgNms.slice(j,j+1).shift());
}

$('btn-qr').onclick=function(){snd();var c=makeCode();$('code-inp').value=c;var h=location.href,q=h.indexOf('?'),u=q!==-1?h.substring(0,q):h,p=u.indexOf('http')===0?u+'?code='+encodeURIComponent(c):c;$('qr-img').src='https://qrserver.com'};
$('btn-copy').onclick=function(){snd();var i=$('code-inp');i.value=makeCode();i.select();try{document.execCommand('copy')}catch(e){}var b=this;b.innerText='Скопировано!';setTimeout(function(){b.innerText='Скопировать код'},1500)};
$('btn-load').onclick=function(){snd();var b=this;if(parseCode($('code-inp').value)){draw();showProf();b.innerText='Успешный вход!';setTimeout(function(){b.innerText='Войти по коду';hide()},1000)}else{b.innerText='Неверный код!';setTimeout(function(){b.innerText='Войти по коду'},1500)}};

$('m-prof').onclick=function(){snd();var p=$('prof-box'),o=p.style.display==='block';hide();if(!o){showProf();p.style.display='block'}};
$('save-prof').onclick=function(){snd();var v=$('nick-inp').value.trim();if(v)nick=v;save();draw();hide()};

function showDaily(){
    var g=$('days-grid');g.innerHTML='';var td=new Date().toISOString().slice(0,10),dn=lastDate===td;
    for(var i=0;i<7;i++){var c=document.createElement('div');c.className='card'+((i+1<day||(i+1===day&&dn))?' done':(i+1===day?' act':''));c.innerHTML='<b>День '+(i+1)+'</b><br>'+prizes.slice(i,i+1).shift();g.appendChild(c)}
    var cb=$('claim-btn');cb.disabled=dn;cb.innerText=dn?'Забрано! Приходи завтра':'Забрать День '+day;
}
$('m-daily').onclick=function(){snd();var b=$('daily-box'),o=b.style.display==='block';hide();if(!o){showDaily();b.style.display='block'}};
$('claim-btn').onclick=function(){var td=new Date().toISOString().slice(0,10);if(lastDate===td)return;snd();if(day===1)score+=100;else if(day===2){bMult=2;bSec=60}else if(day===3)score+=500;else if(day===4)pwr+=2;else if(day===5){bMult=3;bSec=60}else if(day===6)auto+=1;else if(day===7)score+=5000;lastDate=td;day=day>=7?1:day+1;save();draw();showDaily()};

$('m-cont').onclick=function(){snd();$('menu').style.display='none';$('game').style.display='flex';draw()};
$('m-new').onclick=function(){snd();score=0;pwr=1;auto=0;nrg=100;maxNrg=100;cTap=15;cAuto=50;cNrg=200;taps=0;skin='none';hasG=hasD=hasE=hasR=false;bMult=1;bSec=0;bag='';eqPet=-1;save();draw();$('menu').style.display='none';$('game').style.display='flex'};
$('go-menu').onclick=function(){snd();draw();hide();$('bag-box').style.display='none';$('game').style.display='none';$('menu').style.display='flex'};

$('m-top').onclick=function(){
    snd();var box=$('top-box'),o=box.style.display==='block';hide();if(o)return;
    var nms='КлубникаПро|ТаперКинг|Ягодка|МегаКлик|Фермер|Агроном'.split('|'),ls=[];
    for(var i=1;i<=499;i++)ls.push({n:nms.slice(i%6,(i%6)+1).shift()+'_'+(100+i),p:Math.floor(Math.pow(500-i,2.2)*1.2)+25,me:false});
    ls.push({n:ava+' '+nick+' ['+getPr().n+']',p:Math.floor(score),me:true});ls.sort(function(a,b){return b.p-a.p});box.innerHTML='';
    for(var j=0;j<ls.length;j++){var it=ls.slice(j,j+1).shift(),r=document.createElement('div');r.className=it.me?'t-row me':'t-row';r.innerHTML='<span>#'+(j+1)+' '+it.n+'</span><span>'+it.p+'</span>';box.appendChild(r);if(it.me)$('m-info').innerText='Место: #'+(j+1)+' из 500'}
    box.style.display='block';
};

function tap(){if(nrg>=1){taps++;score+=pwr*mult();nrg-=1;snd();draw();save()}}
$('berry').ontouchstart=function(e){e.preventDefault();var c=e.changedTouches?e.changedTouches.length:1;for(var i=0;i<c;i++)tap()};
$('berry').onclick=function(){tap()};

$('b-tap').onclick=function(){if(score>=cTap){score-=cTap;pwr++;cTap=Math.round(cTap*1.5);snd();draw();save()}};
$('b-auto').onclick=function(){if(score>=cAuto){score-=cAuto;auto++;cAuto=Math.round(cAuto*1.6);snd();draw();save()}};
$('b-nrg').onclick=function(){if(score>=cNrg){score-=cNrg;maxNrg+=50;nrg=maxNrg;cNrg=Math.round(cNrg*1.8);snd();draw();save()}};
$('b-gold').onclick=function(){if(hasG)skin=skin==='gold'?'none':'gold';else if(score>=1000){score-=1000;hasG=true;skin='gold'}snd();draw();save()};
$('b-diam').onclick=function(){if(hasD)skin=skin==='diamond'?'none':'diamond';else if(score>=10000){score-=10000;hasD=true;skin='diamond'}snd();draw();save()};
$('b-emer').onclick=function(){if(hasE)skin=skin==='emerald'?'none':'emerald';else if(score>=50000){score-=50000;hasE=true;skin='emerald'}snd();draw();save()};
$('b-ruby').onclick=function(){if(hasR)skin=skin==='ruby'?'none':'ruby';else if(score>=1000000){score-=1000000;hasR=true;skin='ruby'}snd();draw();save()};
$('b-rst').onclick=function(){score=0;pwr=1;auto=0;nrg=100;maxNrg=100;cTap=15;cAuto=50;cNrg=200;taps=0;skin='none';hasG=hasD=hasE=hasR=false;bMult=1;bSec=0;bag='';eqPet=-1;save();draw()};

setInterval(function(){if(auto>0)score+=auto;if(nrg<maxNrg)nrg=Math.min(maxNrg,nrg+Math.max(2,Math.floor(maxNrg/40)));if(bSec>0){bSec--;if(bSec===0)bMult=1}draw();save()},1000);
draw();
</script>
</body>
</html>
