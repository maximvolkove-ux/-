<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berry Tap</title>
<style>
*{touch-action:manipulation}
body{margin:0;font-family:Arial,sans-serif;background:#3b0716;color:#fff;text-align:center;min-height:100vh;overflow-y:auto}
body.bg-night{background:#0f172a}body.bg-forest{background:#06281e}body.bg-royal{background:#240046}
body.world2{background:radial-gradient(circle at top,#3c096c,#10002b 75%)}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:7px;padding:54px 12px 12px;box-sizing:border-box}
#game{display:none;flex-direction:column;align-items:center;justify-content:space-between;min-height:100vh;box-sizing:border-box}
.top-prof-btn{position:fixed;top:10px;right:10px;z-index:20;padding:7px 12px;background:#0077b6;color:#fff;border:2px solid #90e0ef;border-radius:14px;font-size:12px;font-weight:bold;cursor:pointer}
#m-ava{font-size:44px}
.m-btn{width:255px;max-width:92%;padding:10px;font-size:14px;font-weight:bold;color:#fff;background:#a4133c;border:2px solid #ff758f;border-radius:12px;cursor:pointer}
.mp3{width:255px;max-width:92%;padding:7px;background:#7209b7;border:2px solid #f72585;border-radius:12px;box-sizing:border-box;font-size:12px;font-weight:bold;display:block}
.box{width:92%;max-width:400px;max-height:310px;overflow-y:auto;background:#2b0611;border:1px solid #ff758f;border-radius:10px;display:none;padding:10px;box-sizing:border-box}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid #590d22;font-size:13px}
.row.me{background:#a4133c;color:#ffe066;font-weight:bold}
.inp{width:88%;padding:7px;border-radius:8px;border:1px solid #ff758f;background:#3b0716;color:#fff;font-size:13px;text-align:center;margin-bottom:6px}
.opt{padding:6px 10px;border-radius:8px;border:1px solid #ff758f;background:#590d22;color:#fff;cursor:pointer;font-size:15px;margin:2px}
.opt.sel{background:#2b9348;border-color:#aacc00}
.card{display:inline-block;width:28%;margin:2px;background:#590d22;border:1px solid #ff758f;border-radius:6px;padding:5px;font-size:11px}
.card.act{background:#2b9348;font-weight:bold}.card.done{opacity:0.4}
.badge{display:inline-block;background:#b58300;color:#fff;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:bold;border:1px solid #ffe066}
#score{font-size:44px;font-weight:bold;color:#ffccd5;margin:3px}
#berry{width:175px;height:175px;margin:6px auto;border-radius:50%;background:#ff4d6d;border:8px solid #ff8fa3;font-size:74px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;flex-direction:column}
#berry:active{transform:scale(0.92)}
#berry.gold{background:#e6ac00;border-color:#fff3b0;box-shadow:0 0 35px #ffd700}
#berry.diamond{background:#0096c7;border-color:#caf0f8;box-shadow:0 0 40px #00b4d8}
#berry.emerald{background:#2b9348;border-color:#aacc00;box-shadow:0 0 45px #55a630}
#berry.ruby{background:#d00000;border-color:#ffccd5;box-shadow:0 0 55px #ff0054}
#berry.obsidian{background:radial-gradient(circle,#240046,#090014);border-color:#c77dff;box-shadow:0 0 50px #9d4edd}
#berry.sapphire{background:radial-gradient(circle,#0077b6,#03045e);border-color:#90e0ef;box-shadow:0 0 55px #00b4d8}
#berry.platinum{background:linear-gradient(135deg,#ffffff,#adb5bd,#e0fbfc);border-color:#ffd60a;box-shadow:0 0 65px #ffffff}
#berry.ev-skin{background:linear-gradient(135deg,#ff0054,#7209b7,#00b4d8);border-color:#ffd60a;box-shadow:0 0 45px #ffba08}
#berry.ev-black{background:#111;border-color:#ff4d6d;box-shadow:0 0 45px #000}
#berry.ev-rainbow{background:linear-gradient(45deg,#ff0000,#ff9900,#33cc33,#0099ff,#cc33ff);border-color:#fff;box-shadow:0 0 45px #fff}
.shop{background:rgba(0,0,0,0.45);padding:10px;width:100%;max-width:460px;border-radius:20px 20px 0 0;display:flex;flex-wrap:wrap;gap:5px;box-sizing:border-box;margin-top:auto}
.btn{flex:1 1 30%;padding:9px 4px;background:#a4133c;color:#fff;border:1px solid #ff758f;border-radius:8px;font-size:12px;cursor:pointer;font-weight:bold}
.btn:disabled{opacity:0.4}
#bag-box,#wardrobe-box{width:92%;max-width:420px;max-height:185px;overflow-y:auto;background:#1a030a;border:2px solid #ffba08;border-radius:12px;display:none;padding:8px;box-sizing:border-box;margin:4px auto}
.pet{display:inline-block;width:28%;margin:2px;background:#2b0611;border:2px solid #888;border-radius:8px;padding:5px;font-size:11px;cursor:pointer}
.pet.eq{box-shadow:0 0 10px #fff;border-color:#ffd60a;background:#3d2c00}
.r-0{border-color:#adb5bd}.r-1{border-color:#38b000}.r-2{border-color:#00b4d8}.r-3{border-color:#9d4edd}.r-4{border-color:#ff0054}.r-5{border-color:#ffd60a;background:#3d2c00}
.sec{font-size:12px;color:#ffe066;font-weight:bold;margin:8px 0 4px;border-bottom:1px solid #590d22;padding-bottom:2px}
.p-bg{width:100%;height:14px;background:#3b0716;border:1px solid #ff758f;border-radius:8px;overflow:hidden;margin:6px 0}
.p-fl{height:100%;background:linear-gradient(90deg,#ff4d6d,#ffd60a);width:0%}
.oauth-row{display:flex;gap:6px;margin:6px 0}
.btn-ya{flex:1;padding:8px 4px;background:#fc3f1d;color:#fff;border:1px solid #ffccd5;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer}
.btn-go{flex:1;padding:8px 4px;background:#1a73e8;color:#fff;border:1px solid #90e0ef;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="menu">
    <button class="top-prof-btn" id="btn-prof-top" onclick="toggleBox('prof-box')">Profile (<span id="fr-cnt">0</span>)<span id="req-b" style="color:#ffe066"></span></button>
    <div id="m-ava">&#127827;</div>
    <h2 id="m-title" style="margin:0;color:#ffccd5;font-size:20px">BERRY TAP</h2>
    <div id="m-rank" class="badge">Rank: 1 (x1)</div>
    <div id="m-reb" class="badge" style="background:#7209b7;border-color:#f72585">Rebirth: 0 / 25 (x1)</div>
    <div id="m-info" style="color:#ffb3c1;font-size:13px">Loading...</div>
    <button class="m-btn" id="btn-cont" onclick="goGame(false)">Continue</button>
    <button class="m-btn" id="btn-new" onclick="goGame(true)" style="background:#6a040f">New Game</button>
    <button class="m-btn" id="btn-qst" onclick="toggleBox('quest-box')" style="background:#9d4edd;border-color:#ffd60a">Quest (100K)</button>
    <button class="m-btn" id="btn-dly" onclick="toggleBox('daily-box')" style="background:#2b9348">Daily</button>
    <button class="m-btn" id="btn-top" onclick="toggleBox('top-box')" style="background:#b58300">Top 500</button>
    <label class="mp3"><span id="mp3-lbl">MP3</span><input type="file" accept="audio/*" onchange="loadMp3(this)" style="width:100%;margin-top:4px;font-size:11px"></label>
    <div id="quest-box" class="box">
        <div id="q-hdr" style="font-size:13px;color:#ffd60a;font-weight:bold">QUEST</div>
        <div id="q-dsc" style="font-size:12px;color:#ffccd5;margin-top:3px">100 000 -> x25</div>
        <div class="p-bg"><div id="q-fill" class="p-fl"></div></div>
        <div id="q-txt" style="font-size:12px;color:#ffe066;font-weight:bold;margin-bottom:6px">0 / 100 000</div>
        <button class="btn" id="q-claim" onclick="claimQuest()" style="width:100%;background:#2b9348;margin-bottom:6px">Claim</button>
        <div id="q-res" style="font-size:12px;color:#4cc9f0;font-weight:bold;margin-bottom:4px"></div>
        <div style="font-size:11px;color:#ffb3c1"><span id="q-clbl">Skins:</span> <b id="q-col">0</b> / 20</div>
    </div>
    <div id="prof-box" class="box">
        <div id="p-id" style="font-size:14px;color:#4cc9f0;margin-bottom:4px;font-weight:bold">ID: 00000000</div>
        <div id="p-rank" style="font-size:12px;color:#ffe066;margin-bottom:6px;font-weight:bold">0</div>
        <input type="text" id="nick-inp" class="inp" maxlength="15" placeholder="Nick...">
        <div id="ava-row"></div><div id="bg-row"></div>
        <button class="btn" id="btn-savp" onclick="saveProf()" style="width:100%;background:#2b9348;margin:6px 0">Save</button>
        <div class="sec" id="sec-fr">Friends (8-ID):</div>
        <div id="fr-my-id" style="font-size:11px;color:#90e0ef;margin-bottom:4px">ID: 00000000</div>
        <div style="display:flex;gap:4px;margin-bottom:4px"><input type="text" id="fr-inp" class="inp" maxlength="8" placeholder="8 ID..." style="margin:0;flex:1"><button class="btn" id="btn-addf" onclick="sendReq()" style="flex:0.6;background:#e85d04">Add</button></div>
        <div id="fr-msg" style="font-size:11px;color:#ffe066;margin-bottom:4px"></div>
        <div id="req-list"></div><div id="fr-list"></div>
        <div class="sec" id="sec-au">Yandex / Google / Email:</div>
        <div class="oauth-row">
            <button class="btn-ya" id="btn-ya" onclick="socialLogin('yandex')">Yandex ID</button>
            <button class="btn-go" id="btn-go" onclick="socialLogin('google')">Google</button>
        </div>
        <input type="email" id="mail-inp" class="inp" placeholder="Email...">
        <input type="password" id="pass-inp" class="inp" placeholder="Pass...">
        <div style="display:flex;gap:4px;margin-bottom:4px"><button class="btn" id="btn-bnd" onclick="mailBind()" style="background:#0096c7">Bind</button><button class="btn" id="btn-lgn" onclick="mailLogin()" style="background:#e85d04">Login</button></div>
        <div id="mail-msg" style="font-size:11px;color:#4cc9f0;margin-bottom:6px"></div>
        <div style="border-top:1px solid #ff758f;padding-top:6px"><button class="btn" onclick="showQr()" style="background:#7209b7">QR</button><button class="btn" id="btn-ccd" onclick="copyCode()" style="background:#3a0ca3">Code</button><div id="qr-area" style="display:none;background:#fff;padding:6px;border-radius:8px;margin:6px 0"><img id="qr-img" src="" style="width:130px;height:130px;display:block;margin:0 auto"></div><input type="text" id="code-inp" class="inp" placeholder="Code..." style="margin-top:6px"><button class="btn" id="btn-lcd" onclick="loadCode()" style="width:100%;background:#6a040f">Load</button></div>
    </div>
    <div id="daily-box" class="box"><div id="days-grid"></div><button class="btn" id="claim-btn" onclick="claimDaily()" style="width:100%;background:#2b9348;margin-top:6px">Claim</button></div>
    <div id="top-box" class="box"></div>
</div>
<div id="game">
    <div style="padding-top:8px;width:100%">
        <div style="display:flex;gap:5px;justify-content:center;padding:0 10px">
            <button class="btn" id="btn-mnu" onclick="goMenu()" style="padding:7px">Menu</button>
            <button class="btn" id="btn-bag" onclick="toggleBag()" style="padding:7px;background:#e85d04">Bag (<span id="bag-cnt">0</span>)</button>
            <button class="btn" id="btn-skn" onclick="toggleWardrobe()" style="padding:7px;background:#7209b7;border-color:#ffd60a">Skins (<span id="sk-cnt">0</span>/20)</button>
        </div>
        <div id="g-user" style="font-size:13px;color:#ffe066;font-weight:bold;margin-top:3px">Player</div>
        <div id="g-pet" style="font-size:12px;color:#90e0ef">Pet: None (x1)</div>
        <div id="g-rank" class="badge">Rank</div>
        <div id="score">0</div>
        <div style="font-size:13px"><span id="lbl-clk">Tap</span>: <b id="pwr">1</b> | <span id="lbl-sec">Sec</span>: <b id="auto">0</b> | <span id="lbl-nrg">Energy</span>: <b id="nrg">100</b>/<b id="max-nrg">100</b></div>
        <div id="buff" style="color:#ffe066;font-size:12px;font-weight:bold;height:16px"></div>
    </div>
    <div id="bag-box"><div id="pet-grid"></div></div>
    <div id="wardrobe-box"><div id="w-hdr" style="font-size:12px;color:#ffd60a;font-weight:bold;margin-bottom:4px">Skins (x25):</div><div id="sk-grid"></div></div>
    <div id="berry" onclick="tap()">&#127827;</div>
    <div id="drop-info" style="font-size:12px;color:#ffe066;font-weight:bold;height:16px">Tap!</div>
    <div class="shop">
        <button class="btn" id="b-world" onclick="enterWorld2()" style="flex:1 1 95%;background:linear-gradient(90deg,#3a0ca3,#4cc9f0);border-color:#fff;font-size:13px">World 2 (X50)</button>
        <button class="btn" id="b-reb" onclick="doRebirth()" style="flex:1 1 95%;background:linear-gradient(90deg,#ff9e00,#ff0054);border-color:#ffd60a;color:#fff;font-size:13px">Rebirth [0/25]</button>
        <button class="btn" id="b-tap" onclick="buyTap()"><span id="t-tap">Tap +1</span> (<span id="c-tap">15</span>)</button>
        <button class="btn" id="b-auto" onclick="buyAuto()"><span id="t-aut">Bush +1</span> (<span id="c-auto">50</span>)</button>
        <button class="btn" id="b-nrg" onclick="buyNrg()" style="background:#005f73"><span id="t-nrg">Energy +50</span> (<span id="c-nrg">200</span>)</button>
        <button class="btn" id="b-egg" onclick="buyEgg()" style="flex:1 1 95%;background:#7209b7;border-color:#f72585">Egg (500)</button>
        <button class="btn w1-skin" id="b-gold" onclick="buySkin('gold',1000)" style="background:#b58300">Gold (1000)</button>
        <button class="btn w1-skin" id="b-diam" onclick="buySkin('diamond',10000)" style="background:#0077b6">Diamond (10K)</button>
        <button class="btn w1-skin" id="b-emer" onclick="buySkin('emerald',50000)" style="background:#2b9348">Emerald (50K)</button>
        <button class="btn w1-skin" id="b-ruby" onclick="buySkin('ruby',1000000)" style="flex:1 1 65%;background:#9b0000">Ruby x50 (1M)</button>
        <button class="btn w2-skin" id="b-obs" onclick="buySkin('obsidian',100000)" style="display:none;background:#3c096c;border-color:#c77dff">Obsidian x25 (100K)</button>
        <button class="btn w2-skin" id="b-sap" onclick="buySkin('sapphire',10000000)" style="display:none;background:#023e8a;border-color:#90e0ef">Sapphire x50 (10M)</button>
        <button class="btn w2-skin" id="b-pla" onclick="buySkin('platinum',1000000000)" style="display:none;flex:1 1 65%;background:#495057;border-color:#ffd60a">Platinum x100 (1B)</button>
        <button class="btn" id="b-rst" onclick="resetAll()" style="flex:1 1 25%;background:#2b0611">Reset</button>
    </div>
</div>
<script>
var RU={
    title:'\u0422\u0410\u041f\u0410\u0419 \u041f\u041e \u041a\u041b\u0423\u0411\u041d\u0418\u041a\u0415',
    prof:'\u041f\u0440\u043e\u0444\u0438\u043b\u044c / \u0414\u0440\u0443\u0437\u044c\u044f',
    cont:'\u041f\u0440\u043e\u0434\u043e\u043b\u0436\u0438\u0442\u044c \u0438\u0433\u0440\u0443',
    newg:'\u041d\u043e\u0432\u0430\u044f \u0438\u0433\u0440\u0430',
    qst:'\u041d\u0435\u0434\u0435\u043b\u044c\u043d\u043e\u0435 \u0438\u0441\u043f\u044b\u0442\u0430\u043d\u0438\u0435 (100\u043a)',
    dly:'\u0415\u0436\u0435\u0434\u043d\u0435\u0432\u043d\u044b\u0439 \u043f\u0440\u0438\u0437',
    top:'\u0422\u043e\u043f 500 \u043b\u0443\u0447\u0448\u0438\u0445',
    mp3:'\u0412\u044b\u0431\u0440\u0430\u0442\u044c \u043c\u0443\u0437\u044b\u043a\u0443 (.mp3)',
    plr:'\u0418\u0433\u0440\u043e\u043a',
    mnu:'\u0412 \u043c\u0435\u043d\u044e',
    bag:'\u0420\u044e\u043a\u0437\u0430\u043a',
    skn:'\u0421\u043a\u0438\u043d\u044b',
    clk:'\u041a\u043b\u0438\u043a',
    sec:'\u0421\u0435\u043a',
    nrg:'\u042d\u043d\u0435\u0440\u0433\u0438\u044f',
    tap1:'\u0421\u0438\u043b\u0430 +1',
    aut1:'\u041a\u0443\u0441\u0442 +1',
    nrg1:'\u042d\u043d\u0435\u0440\u0433\u0438\u044f +50',
    egg:'\u041a\u0443\u043f\u0438\u0442\u044c \u042f\u0439\u0446\u043e \u043f\u0438\u0442\u043e\u043c\u0446\u0430 (500)',
    rst:'\u0421\u0431\u0440\u043e\u0441',
    ya:'\u042f\u043d\u0434\u0435\u043a\u0441 ID',
    go:'Google \u0412\u0445\u043e\u0434',
    bnd:'\u041f\u0440\u0438\u0432\u044f\u0437\u0430\u0442\u044c',
    lgn:'\u0412\u043e\u0439\u0442\u0438',
    sav:'\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u043f\u0440\u043e\u0444\u0438\u043b\u044c',
    add:'\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c',
    clm:'\u0417\u0430\u0431\u0440\u0430\u0442\u044c!',
    ccd:'\u041a\u043e\u0434',
    lcd:'\u0417\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044c \u043a\u043e\u0434',
    frh:'\u0414\u0440\u0443\u0437\u044c\u044f (8-\u0437\u043d\u0430\u0447\u043d\u044b\u0439 ID):',
    auh:'\u0412\u0445\u043e\u0434 \u0447\u0435\u0440\u0435\u0437 \u042f\u043d\u0434\u0435\u043a\u0441 / Google / \u041f\u043e\u0447\u0442\u0443:'
};

function $(id){return document.getElementById(id)||{style:{}}}
document.title=RU.title;
$('m-title').innerText=RU.title;$('btn-cont').innerText=RU.cont;$('btn-new').innerText=RU.newg;
$('btn-qst').innerText=RU.qst;$('btn-dly').innerText=RU.dly;$('btn-top').innerText=RU.top;
$('mp3-lbl').innerText=RU.mp3;$('btn-mnu').innerText=RU.mnu;$('lbl-clk').innerText=RU.clk;
$('lbl-sec').innerText=RU.sec;$('lbl-nrg').innerText=RU.nrg;$('t-tap').innerText=RU.tap1;
$('t-aut').innerText=RU.aut1;$('t-nrg').innerText=RU.nrg1;$('b-egg').innerText=RU.egg;
$('b-rst').innerText=RU.rst;$('btn-ya').innerText=RU.ya;$('btn-go').innerText=RU.go;
$('btn-bnd').innerText=RU.bnd;$('btn-lgn').innerText=RU.lgn;$('btn-savp').innerText=RU.sav;
$('btn-addf').innerText=RU.add;$('claim-btn').innerText=RU.clm;$('btn-ccd').innerText=RU.ccd;
$('btn-lcd').innerText=RU.lcd;$('sec-fr').innerText=RU.frh;$('sec-au').innerText=RU.auh;

var score=0,maxScore=0,pwr=1,auto=0,nrg=100,maxNrg=100,cTap=15,cAuto=50,cNrg=200,taps=0,rebirths=0,world=1;
var skin='none',hasG=false,hasD=false,hasE=false,hasR=false,hasObs=false,hasSap=false,hasPla=false;
var day=1,lastDate='',bMult=1,bSec=0,nick=RU.plr,ava='&#127827;',bg='',bgm=null,bag='',eqPet=-1,friends=[],qProg=0,mySkins=[],eqEvSkin=-1,uMail='';
