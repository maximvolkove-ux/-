<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>&#1058;&#1072;&#1087;&#1072;&#1081; &#1087;&#1086; &#1082;&#1083;&#1091;&#1073;&#1085;&#1080;&#1082;&#1077;</title>
<style>
*{touch-action:manipulation;box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#3b0716;color:#fff;text-align:center;min-height:100vh}
body.bg-night{background:#0f172a}body.bg-forest{background:#06281e}body.bg-royal{background:#240046}
body.world2{background:radial-gradient(circle at top,#3c096c,#10002b 75%)}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:7px;padding:54px 12px 12px}
#game{display:none;flex-direction:column;align-items:center;justify-content:space-between;min-height:100vh}
.top-prof-btn{position:fixed;top:10px;right:10px;z-index:20;padding:7px 12px;background:#0077b6;color:#fff;border:2px solid #90e0ef;border-radius:14px;font-size:12px;font-weight:bold;cursor:pointer}
.m-btn{width:255px;max-width:92%;padding:10px;font-size:14px;font-weight:bold;color:#fff;background:#a4133c;border:2px solid #ff758f;border-radius:12px;cursor:pointer}
.mp3{width:255px;max-width:92%;padding:7px;background:#7209b7;border:2px solid #f72585;border-radius:12px;font-size:12px;font-weight:bold;display:block}
.box{width:92%;max-width:400px;max-height:310px;overflow-y:auto;background:#2b0611;border:1px solid #ff758f;border-radius:10px;display:none;padding:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid #590d22;font-size:13px}
.row.me{background:#a4133c;color:#ffe066;font-weight:bold}
.inp{width:88%;padding:7px;border-radius:8px;border:1px solid #ff758f;background:#3b0716;color:#fff;font-size:13px;text-align:center;margin-bottom:6px}
.opt{padding:6px 10px;border-radius:8px;border:1px solid #ff758f;background:#590d22;color:#fff;cursor:pointer;font-size:15px;margin:2px}
.opt.sel{background:#2b9348;border-color:#aacc00}
.card{display:inline-block;width:28%;margin:2px;background:#590d22;border:1px solid #ff758f;border-radius:6px;padding:5px;font-size:11px}
.card.act{background:#2b9348;font-weight:bold}.card.done{opacity:0.4}
.badge{display:inline-block;background:#b58300;color:#fff;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:bold;border:1px solid #ffe066}
#score{font-size:44px;font-weight:bold;color:#ffccd5;margin:3px}
#berry{width:175px;height:175px;margin:6px auto;border-radius:50%;background:#ff4d6d;border:8px solid #ff8fa3;font-size:74px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;flex-direction:column;outline:none;-webkit-tap-highlight-color:transparent}
#berry:active{transform:scale(0.92)}
#berry.gold{background:#e6ac00;border-color:#fff3b0;box-shadow:0 0 35px #ffd700}
#berry.diamond{background:#0096c7;border-color:#caf0f8;box-shadow:0 0 40px #00b4d8}
#berry.emerald{background:#2b9348;border-color:#aacc00;box-shadow:0 0 45px #55a630}
#berry.ruby{background:#d00000;border-color:#ffccd5;box-shadow:0 0 55px #ff0054}
#berry.obsidian{background:radial-gradient(circle,#240046,#090014);border-color:#c77dff;box-shadow:0 0 50px #9d4edd}
#berry.sapphire{background:radial-gradient(circle,#0077b6,#03045e);border-color:#90e0ef;box-shadow:0 0 55px #00b4d8}
#berry.platinum{background:linear-gradient(135deg,#fff,#adb5bd,#e0fbfc);border-color:#ffd60a;box-shadow:0 0 65px #fff}
#berry.ev-skin{background:linear-gradient(135deg,#ff0054,#7209b7,#00b4d8);border-color:#ffd60a;box-shadow:0 0 45px #ffba08}
#berry.ev-black{background:#111;border-color:#ff4d6d;box-shadow:0 0 45px #000}
#berry.ev-rainbow{background:linear-gradient(45deg,#f00,#f90,#3c3,#09f,#c3f);border-color:#fff;box-shadow:0 0 45px #fff}
.shop{background:rgba(0,0,0,0.45);padding:10px;width:100%;max-width:460px;border-radius:20px 20px 0 0;display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.btn{flex:1 1 30%;padding:9px 4px;background:#a4133c;color:#fff;border:1px solid #ff758f;border-radius:8px;font-size:12px;cursor:pointer;font-weight:bold}
.btn:disabled{opacity:0.4}
#bag-box,#wardrobe-box{width:92%;max-width:420px;max-height:185px;overflow-y:auto;background:#1a030a;border:2px solid #ffba08;border-radius:12px;display:none;padding:8px;margin:4px auto}
.pet{display:inline-block;width:28%;margin:2px;background:#2b0611;border:2px solid #888;border-radius:8px;padding:5px;font-size:11px;cursor:pointer}
.pet.eq{box-shadow:0 0 10px #fff;border-color:#ffd60a;background:#3d2c00}
.r-0{border-color:#adb5bd}.r-1{border-color:#38b000}.r-2{border-color:#00b4d8}.r-3{border-color:#9d4edd}.r-4{border-color:#ff0054}.r-5{border-color:#ffd60a;background:#3d2c00}
.sec{font-size:12px;color:#ffe066;font-weight:bold;margin:8px 0 4px;border-bottom:1px solid #590d22;padding-bottom:2px}
.p-bg{width:100%;height:14px;background:#3b0716;border:1px solid #ff758f;border-radius:8px;overflow:hidden;margin:6px 0}
.p-fl{height:100%;background:linear-gradient(90deg,#ff4d6d,#ffd60a);width:0%}
.oauth-row{display:flex;gap:6px;margin:6px 0}
.btn-ya{flex:1;padding:8px 4px;background:#fc3f1d;color:#fff;border:1px solid #ffccd5;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer}
.btn-go{flex:1;padding:8px 4px;background:#1a73e8;color:#fff;border:1px solid #90e0ef;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer}
</style>
<script>
function el(id){return document.getElementById(id)||{style:{}}}
var score=0,maxScore=0,pwr=1,auto=0,nrg=100,maxNrg=100,cTap=15,cAuto=50,cNrg=200,taps=0,rebirths=0,world=1,lastTap=0;
var skin='none',hasG=false,hasD=false,hasE=false,hasR=false,hasObs=false,hasSap=false,hasPla=false;
var day=1,lastDate='',bMult=1,bSec=0,nick='\u0418\u0433\u0440\u043e\u043a',ava='&#127827;',bg='',bgm=null,bag='',eqPet=-1,friends=new Array(),qProg=0,mySkins=new Array(),eqEvSkin=-1,uMail='';

var evNames='\u041f\u0440\u043e\u0442\u0438\u0432\u043e\u0433\u0430\u0437|\u0421\u043a\u0435\u043b\u0435\u0442|\u0422\u044b\u043a\u0432\u0430|\u0420\u0430\u0434\u0443\u0433\u0430|\u041a\u043e\u0442|\u0427\u0451\u0440\u043d\u0430\u044f|\u0420\u043e\u0431\u043e\u0442|\u0425\u043e\u043a\u043a\u0435\u0438\u0441\u0442|\u0411\u043e\u043a\u0441\u0451\u0440|\u041b\u044b\u0441\u044b\u0439 \u043a\u043e\u0442|\u041a\u0438\u0431\u0435\u0440|\u041f\u0440\u0438\u0437\u0440\u0430\u043a|\u0414\u0440\u0430\u043a\u043e\u043d|\u041d\u0438\u043d\u0434\u0437\u044f|\u041a\u043e\u0441\u043c\u043e\u0441|\u041f\u0438\u0440\u0430\u0442|\u041a\u043e\u0440\u043e\u043b\u044c|\u0412\u0430\u043c\u043f\u0438\u0440|\u041d\u041b\u041e|\u041e\u0433\u043e\u043d\u044c'.split('|');
var evIcons='&#127827;&#128567;|&#128128;|&#127875;|&#127752;&#127827;|&#128049;|&#128420;&#127827;|&#129302;|&#127954;&#127827;|&#129354;&#127827;|&#128008;&#9829;|&#128374;&#127827;|&#128123;|&#128009;|&#129399;|&#128640;&#127827;|&#127988;&#8205;&#9760;&#65039;|&#128081;&#127827;|&#129499;|&#128125;|&#128293;&#127827;'.split('|');
var prizes='+100|x2 (60\u0441)|+500|+2 \u0441\u0438\u043b\u0430|x3 (60\u0441)|+1 \u043a\u0443\u0441\u0442|+5000'.split('|');
var avas='&#127827;|&#128526;|&#128081;|&#128049;|&#129302;|&#128293;'.split('|');
var bgIds='|bg-night|bg-forest|bg-royal'.split('|'),bgNms='\u042f\u0433\u043e\u0434\u0430|\u041d\u043e\u0447\u044c|\u041b\u0435\u0441|\u041d\u0435\u043e\u043d'.split('|');
var pRar='\u041e\u0431\u044b\u0447\u043d\u044b\u0439|\u0420\u0435\u0434\u043a\u0438\u0439|\u0421\u0432\u0435\u0440\u0445\u0440\u0435\u0434\u043a\u0438\u0439|\u042d\u043f\u0438\u043a|\u041c\u0438\u0444\u0438\u043a|\u041b\u0435\u0433\u0435\u043d\u0434\u0430'.split('|');
var pNam='\u0426\u044b\u043f\u043b\u0451\u043d\u043e\u043a|\u0421\u043e\u0431\u0430\u043a\u0430|\u041f\u0430\u043d\u0434\u0430|\u0422\u0438\u0433\u0440|\u041a\u0430\u0440\u0430\u0441\u044c|\u041a\u043e\u0442'.split('|');
var pIco='&#128037;|&#128054;|&#128060;|&#128047;|&#128031;|&#128049;'.split('|');
var pMul='1.2|1.5|3|5|10|20'.split('|');

function gen8Id(){return String(Math.floor(10000000+Math.random()*90000000))}
function is8Id(s){return typeof s==='string'&&s.length===8&&!isNaN(+s)&&+s>=10000000}
var uid=gen8Id();
var rebBase='100|500|1000|10000|25000|50000|100000|250000|500000'.split('|');
var rebSteps='1|2.5|5'.split('|');
function getRebCost(){if(rebirths<rebBase.length)return +rebBase.slice(rebirths,rebirths+1).shift();var idx=rebirths-rebBase.length,pow=Math.floor(idx/3)+6;return(+rebSteps.slice(idx%3,(idx%3)+1).shift())*Math.pow(10,pow)}
function rebMult(){return Math.pow(2,rebirths)}
function worldMult(){return world===2?50:1}
function getPr(){var s=Math.max(Math.floor(score),Math.floor(maxScore));if(s>=1000000)return{n:'\u0411\u043e\u0433',m:10,nx:'MAX',cur:s};if(s>=250000)return{n:'\u041b\u0435\u0433\u0435\u043d\u0434\u0430',m:5,nx:1000000,cur:s};if(s>=50000)return{n:'\u041f\u0440\u043e',m:3,nx:250000,cur:s};if(s>=10000)return{n:'\u041f\u043e\u043b\u0443-\u043f\u0440\u043e',m:2,nx:50000,cur:s};if(s>=1000)return{n:'\u041b\u044e\u0431\u0438\u0442\u0435\u043b\u044c',m:1.5,nx:10000,cur:s};return{n:'\u041d\u043e\u0432\u0438\u0447\u043e\u043a',m:1,nx:1000,cur:s}}

function snd(){
    try{
        var C=window.AudioContext||window.webkitAudioContext;
        if(!C)return;
        if(!window.ac)window.ac=new C();
        if(window.ac.state==='suspended')window.ac.resume();
        var t=window.ac.currentTime,o=window.ac.createOscillator(),g=window.ac.createGain();
        o.type='triangle';
        o.frequency.setValueAtTime(560+Math.random()*160,t);
        o.frequency.exponentialRampToValueAtTime(120,t+0.055);
        g.gain.setValueAtTime(0.32,t);
        g.gain.exponentialRampToValueAtTime(0.01,t+0.055);
        o.connect(g);g.connect(window.ac.destination);
        o.start(t);o.stop(t+0.055);
    }catch(e){}
}

function petMult(){return(eqPet>=0&&eqPet<=5)?+pMul.slice(eqPet,eqPet+1).shift():1}
function skinMult(){if(eqEvSkin>=0&&eqEvSkin<20)return 25;return skin==='gold'?2:skin==='diamond'?5:skin==='emerald'?15:skin==='ruby'?50:skin==='obsidian'?25:skin==='sapphire'?50:skin==='platinum'?100:1}
function mult(){return skinMult()*bMult*getPr().m*petMult()*rebMult()*worldMult()}

function tap(ev){
    if(ev&&ev.preventDefault)ev.preventDefault();
    var now=Date.now();
    if(now-lastTap<35)return;
    lastTap=now;
    if(nrg>=1){
        var g=pwr*mult();
        taps++;score+=g;qProg+=g;nrg-=1;
        snd();draw();save();
    }
}

function getObj(){if(score>maxScore)maxScore=score;return{uid:uid,score:Math.floor(score),maxScore:Math.floor(maxScore),power:pwr,auto:auto,energy:Math.floor(nrg),maxNrg:maxNrg,costTap:cTap,costAuto:cAuto,costNrg:cNrg,taps:taps,rebirths:rebirths,world:world,hasGold:hasG,hasDiamond:hasD,hasEmerald:hasE,hasRuby:hasR,hasObs:hasObs,hasSap:hasSap,hasPla:hasPla,skin:skin,day:day,lastDate:lastDate,nick:nick,ava:ava,bgTheme:bg,bag:bag,eqPet:eqPet,friends:friends,qProg:Math.floor(qProg),mySkins:mySkins,eqEvSkin:eqEvSkin,uMail:uMail}}
function setObj(d){if(!d)return;if(is8Id(String(d.uid)))uid=String(d.uid);score=+d.score||0;maxScore=Math.max(score,+d.maxScore||0);pwr=+d.power||1;auto=+d.auto||0;nrg=+d.energy||100;maxNrg=+d.maxNrg||100;cTap=+d.costTap||15;cAuto=+d.costAuto||50;cNrg=+d.costNrg||200;taps=+d.taps||0;rebirths=Math.min(25,+d.rebirths||0);world=(d.world===2&&rebirths>=25)?2:1;hasG=!!d.hasGold;hasD=!!d.hasDiamond;hasE=!!d.hasEmerald;hasR=!!d.hasRuby;hasObs=!!d.hasObs;hasSap=!!d.hasSap;hasPla=!!d.hasPla;skin=d.skin||'none';day=+d.day||1;lastDate=d.lastDate||'';if(d.nick&&d.nick.indexOf('?')===-1)nick=d.nick;if(d.ava)ava=d.ava;if(d.bgTheme)bg=d.bgTheme;if(typeof d.bag==='string')bag=d.bag;if(typeof d.eqPet==='number')eqPet=d.eqPet;if(Array.isArray(d.friends))friends=d.friends;qProg=+d.qProg||0;if(Array.isArray(d.mySkins))mySkins=d.mySkins;if(typeof d.eqEvSkin==='number')eqEvSkin=d.eqEvSkin;if(d.uMail)uMail=d.uMail}
function makeCode(){return btoa(unescape(encodeURIComponent(JSON.stringify(getObj()))))}
function parseCode(s){try{var c=s.trim(),p=c.indexOf('code=');if(p!==-1)c=decodeURIComponent(c.substring(p+5));var a=c.indexOf('&');if(a!==-1)c=c.substring(0,a);setObj(JSON.parse(decodeURIComponent(escape(atob(c)))));save();return true}catch(e){return false}}
try{var sv=JSON.parse(localStorage.getItem('berry_v3'));if(sv)setObj(sv);if(location.search.indexOf('code=')!==-1&&parseCode(location.search))history.replaceState({},'',location.pathname);save()}catch(e){}
function save(){try{if(score>maxScore)maxScore=score;localStorage.setItem('berry_v3',JSON.stringify(getObj()))}catch(e){}}
function fmtNum(n){
    if(n>=1e30)return Math.round(n/1e28)/100+'No';
    if(n>=1e27)return Math.round(n/1e25)/100+'Oc';
    if(n>=1e24)return Math.round(n/1e22)/100+'Sp';
    if(n>=1e21)return Math.round(n/1e19)/100+'Sx';
    if(n>=1e18)return Math.round(n/1e16)/100+'Qi';
    if(n>=1e15)return Math.round(n/1e13)/100+'Qa';
    if(n>=1e12)return Math.round(n/1e10)/100+'T';
    if(n>=1e9)return Math.round(n/1e7)/100+'B';
    if(n>=1e6)return Math.round(n/1e4)/100+'M';
    if(n>=1e4)return Math.round(n/10)/100+'K';
    return Math.floor(n);
}

function draw(){
    try{
        if(score>maxScore)maxScore=score;
        var pr=getPr(),rm=rebMult(),rc=getRebCost(),wm=worldMult();
        document.body.className=(world===2?'world2':bg);
        el('fr-cnt').innerText=friends.length;el('bag-cnt').innerText=bag.length;el('sk-cnt').innerText=mySkins.length;
        el('m-ava').innerHTML=ava;el('g-user').innerHTML=ava+' '+nick+(world===2?' [\u041c\u0418\u0420 2: X50]':'');
        el('m-rank').innerText='\u0420\u0430\u043d\u0433: '+pr.n+' (x'+pr.m+')';
        el('m-reb').innerText='\u041f\u0435\u0440\u0435\u0440\u043e\u0436\u0434\u0435\u043d\u0438\u0439: '+rebirths+' / 25 (x'+fmtNum(rm)+')'+(world===2?' | \u041c\u0418\u0420 2':'');
        el('g-rank').innerText=(world===2?'\u041c\u0418\u0420 2 (X50) | ':'')+pr.n+' | \u041f\u0435\u0440\u0435\u0440\u043e\u0436\u0434: '+rebirths+'/25';
        el('g-pet').innerHTML=(eqPet>=0&&eqPet<=5)?('\u041f\u0438\u0442\u043e\u043c\u0435\u0446: '+pIco.slice(eqPet,eqPet+1).shift()+' '+pNam.slice(eqPet,eqPet+1).shift()+' (x'+petMult()+')'):'\u041f\u0438\u0442\u043e\u043c\u0435\u0446: \u041d\u0435\u0442 (x1)';
        el('score').innerText=fmtNum(score);el('m-info').innerText=nick+' (ID: '+uid+') | \u0421\u0447\u0451\u0442: '+fmtNum(score);
        el('pwr').innerText=fmtNum(Math.round(pwr*mult()*10)/10);el('auto').innerText=fmtNum(auto*rm*wm);el('nrg').innerText=Math.floor(nrg);el('max-nrg').innerText=maxNrg;
        el('c-tap').innerText=fmtNum(cTap);el('c-auto').innerText=fmtNum(cAuto);el('c-nrg').innerText=fmtNum(cNrg);
        el('buff').innerText=bSec>0?('\u0411\u041e\u041d\u0423\u0421 x'+bMult+': '+bSec+'\u0441'):'';

        var bW=el('b-world');
        if(rebirths<25){bW.disabled=true;bW.innerText='\u041d\u043e\u0432\u044b\u0439 \u043c\u0438\u0440 (X50) — \u041d\u0443\u0436\u043d\u043e 25 \u043f\u0435\u0440\u0435\u0440\u043e\u0436\u0434. ['+rebirths+'/25]'}
        else if(world===1){bW.disabled=false;bW.innerText='\u0412\u043e\u0439\u0442\u0438 \u0432 \u041d\u043e\u0432\u044b\u0439 \u043c\u0438\u0440 (X50) [\u0421\u0431\u0440\u043e\u0441 \u0432\u0441\u0435\u0433\u043e]'}
        else{bW.disabled=true;bW.innerText='\u0412\u044b \u0432 \u041d\u043e\u0432\u043e\u043c \u043c\u0438\u0440\u0435 (X50) — \u0411\u043e\u043d\u0443\u0441 \u0430\u043a\u0442\u0438\u0432\u0435\u043d!'}

        var bReb=el('b-reb');
        if(rebirths>=25){bReb.disabled=true;bReb.innerText='\u041c\u0410\u041a\u0421. \u041f\u0415\u0420\u0415\u0420\u041e\u0416\u0414\u0415\u041d\u0418\u0415 25/25 (x'+fmtNum(rm)+')'}
        else{bReb.disabled=score<rc;bReb.innerText='\u041f\u0435\u0440\u0435\u0440\u043e\u0436\u0434\u0435\u043d\u0438\u0435 ['+rebirths+'/25] -> X2 ('+fmtNum(rc)+')'}

        el('b-tap').disabled=score<cTap;el('b-auto').disabled=score<cAuto;el('b-nrg').disabled=score<cNrg;el('b-egg').disabled=score<500;
        var bEl=el('berry');
        if(eqEvSkin>=0&&eqEvSkin<20){bEl.className=eqEvSkin===5?'ev-black':(eqEvSkin===3?'ev-rainbow':'ev-skin');bEl.innerHTML='<div style="font-size:58px;line-height:1">'+evIcons.slice(eqEvSkin,eqEvSkin+1).shift()+'</div><div style="font-size:11px;font-weight:bold;color:#fff;margin-top:3px">'+evNames.slice(eqEvSkin,eqEvSkin+1).shift()+'</div>'}
        else{bEl.className=skin==='none'?'':skin;bEl.innerHTML='&#127827;'}

        var w1s=document.getElementsByClassName('w1-skin'),w2s=document.getElementsByClassName('w2-skin');
        for(var i=0;i<w1s.length;i++)w1s.item(i).style.display=(world===1)?'inline-block':'none';
        for(var j=0;j<w2s.length;j++)w2s.item(j).style.display=(world===2)?'inline-block':'none';
